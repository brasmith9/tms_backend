services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: voyago
      POSTGRES_PASSWORD: voyago
      POSTGRES_DB: voyago
    ports: ['5544:5432']
    volumes: ['voyago_pg:/var/lib/postgresql/data']
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: voyago
      POSTGRES_PASSWORD: voyago
      POSTGRES_DB: voyago_test
    ports: ['5545:5432']
volumes:
  voyago_pg:
